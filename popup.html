<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simple Screenshot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>Simple Screenshot</header>
  <nav>
    <button class="mode" data-mode="visible">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
      <span class="label">Visible part</span>
      <kbd data-command="capture-visible"></kbd>
    </button>
    <button class="mode" data-mode="full">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v9M8.5 12.5 12 16l3.5-3.5"/></svg>
      <span class="label">Full page</span>
      <kbd data-command="capture-full"></kbd>
    </button>
    <button class="mode" data-mode="area">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M12 9v6M9 12h6"/></svg>
      <span class="label">Selected area</span>
      <kbd data-command="capture-area"></kbd>
    </button>
  </nav>
  <p id="status" class="status" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
